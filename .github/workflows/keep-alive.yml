name: Keep Alive

on:
  schedule:
    - cron: '0 0 1,15 * *'   # runs at 00:00 UTC on the 1st and 15th of each month
  workflow_dispatch:          # lets you trigger it manually from the Actions tab too

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create commit
        run: |
          git config user.name "MPHONlC"
          git config user.email "207844175+MPHONlC@users.noreply.github.com"
          git commit --allow-empty -m "chore: keep-alive"
          git push
