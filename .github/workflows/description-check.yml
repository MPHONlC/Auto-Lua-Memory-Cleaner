name: Description Content Check

on:
  push:
    branches: [main]
    paths:
      - 'README_BBCODE.txt'
      - 'README_COMMONMARK.txt'
      - 'README.md'
      - '.github/description-ignore.txt'
  workflow_dispatch:
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: MPHONlC/description-check@Version-0.0.2
        with:
          bbcode_file: 'README_BBCODE.txt'
          manifest_file: 'AutoLuaMemoryCleaner.addon'
