name: ESOUI Release

on:
  workflow_dispatch:
    inputs:
      test_run:
        description: "Test Run (dry-run ESOUI upload - safe, validates without publishing anything)"
        type: boolean
        default: true
      upload_esoui:
        description: "Upload to ESOUI"
        type: boolean
        default: false
      release_github:
        description: "Release to Github"
        type: boolean
        default: false

jobs:
  check:
    uses: ./.github/workflows/lua-check.yml

  refresh-version:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Refresh AddOnVersion date prefix only (never the version suffix)
        id: refresh
        run: |
          MANIFEST="AutoLuaMemoryCleaner.addon"
          TODAY=$(date +%y%m%d)
          CURRENT=$(grep "^## AddOnVersion:" "$MANIFEST" | awk '{print $3}')
          SUFFIX="${CURRENT: -3}"
          NEW="${TODAY}${SUFFIX}"
          echo "Current AddOnVersion: $CURRENT"
          echo "New AddOnVersion:     $NEW"
          echo "old=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "new=$NEW" >> "$GITHUB_OUTPUT"
          if [ "$CURRENT" = "$NEW" ]; then
            echo "Already up to date, nothing to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sed -i "s/## AddOnVersion: $CURRENT/## AddOnVersion: $NEW/" "$MANIFEST"
          git config user.name "MPHONlC"
          git config user.email "207844175+MPHONlC@users.noreply.github.com"
          git add "$MANIFEST"
          git commit -m "chore: refresh AddOnVersion date to $TODAY [skip ci]"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Annotate result
        if: always()
        run: |
          STATUS="${{ steps.refresh.outcome }}"
          if [ "$STATUS" != "success" ]; then
            TITLE="Version Refresh Failed"
            echo "::error title=$TITLE::Check the 'Refresh AddOnVersion date prefix' step's log above."
          elif [ "${{ steps.refresh.outputs.changed }}" == "true" ]; then
            TITLE="Version Refresh Complete"
            echo "::notice title=$TITLE::AddOnVersion updated from ${{ steps.refresh.outputs.old }} to ${{ steps.refresh.outputs.new }} and pushed."
          else
            TITLE="Version Already Up To Date"
            echo "::notice title=$TITLE::AddOnVersion is already ${{ steps.refresh.outputs.old }} - nothing to change."
          fi
          {
            echo "## $TITLE"
            echo ""
            echo "- **Previous AddOnVersion:** ${{ steps.refresh.outputs.old }}"
            echo "- **Current AddOnVersion:** ${{ steps.refresh.outputs.new }}"
          } >> "$GITHUB_STEP_SUMMARY"

  refresh-api-version:
    needs: [check, refresh-version]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check esoui/esoui for the current live API version
        id: refresh
        run: |
          MANIFEST="AutoLuaMemoryCleaner.addon"

          README_CONTENT=$(curl -sL "https://raw.githubusercontent.com/esoui/esoui/live/README.md")
          NEW_API=$(echo "$README_CONTENT" | grep -oP '\(API \K[0-9]+' | head -1)

          CURRENT_LINE=$(grep "^## APIVersion:" "$MANIFEST")
          CURRENT_FIRST=$(echo "$CURRENT_LINE" | awk '{print $3}')
          CURRENT_SECOND=$(echo "$CURRENT_LINE" | awk '{print $4}')

          echo "Current manifest line: $CURRENT_LINE"
          echo "esoui/esoui reports:   API $NEW_API"
          echo "current=$CURRENT_FIRST $CURRENT_SECOND" >> "$GITHUB_OUTPUT"

          if ! [[ "$NEW_API" =~ ^[0-9]{5,7}$ ]]; then
            echo "Could not extract a valid API version - aborting without changing anything."
            echo "result=extraction_failed" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$NEW_API" -le "$CURRENT_FIRST" ]; then
            echo "No newer API version than what's already declared - nothing to do."
            echo "result=up_to_date" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          NEW_SECOND=$((NEW_API + 1))
          sed -i "s/## APIVersion: $CURRENT_FIRST $CURRENT_SECOND/## APIVersion: $NEW_API $NEW_SECOND/" "$MANIFEST"
          echo "Updated to: $(grep '^## APIVersion:' "$MANIFEST")"

          git config user.name "MPHONlC"
          git config user.email "207844175+MPHONlC@users.noreply.github.com"
          git add "$MANIFEST"
          git commit -m "chore: bump APIVersion to $NEW_API $NEW_SECOND (esoui/esoui reports API $NEW_API live)"
          git push
          echo "new=$NEW_API $NEW_SECOND" >> "$GITHUB_OUTPUT"
          echo "result=updated" >> "$GITHUB_OUTPUT"

      - name: Annotate result
        if: always()
        run: |
          STATUS="${{ steps.refresh.outcome }}"
          RESULT="${{ steps.refresh.outputs.result }}"
          CURRENT="${{ steps.refresh.outputs.current }}"
          NEW="${{ steps.refresh.outputs.new }}"
          AFTER="${NEW:-$CURRENT}"
          if [ "$STATUS" != "success" ]; then
            TITLE="API Version Refresh Failed"
            echo "::error title=$TITLE::Check the 'Check esoui/esoui for the current live API version' step's log above."
          elif [ "$RESULT" == "updated" ]; then
            TITLE="API Version Refresh Complete"
            echo "::notice title=$TITLE::APIVersion updated from $CURRENT to $NEW and pushed."
          elif [ "$RESULT" == "up_to_date" ]; then
            TITLE="API Version Already Up To Date"
            echo "::notice title=$TITLE::Declared API $CURRENT already matches or exceeds what esoui/esoui reports live."
          else
            TITLE="API Version Refresh Skipped"
            echo "::warning title=$TITLE::Could not extract a valid API version number from esoui/esoui's README - nothing changed."
          fi
          {
            echo "## $TITLE"
            echo ""
            echo "- **Declared API (before):** $CURRENT"
            echo "- **Declared API (after):** $AFTER"
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    needs: [check, refresh-version, refresh-api-version]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read version from manifest
        id: version
        run: |
          VER=$(grep "^## AddOnVersion:" AutoLuaMemoryCleaner.addon | awk '{print $3}')
          DISPLAY_VER=$(grep "^## Version:" AutoLuaMemoryCleaner.addon | awk '{print $3}')
          API_VER=$(grep "^## APIVersion:" AutoLuaMemoryCleaner.addon | awk '{print $3, $4}')
          echo "Read version: $VER (display: $DISPLAY_VER, API: $API_VER)"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "display_version=$DISPLAY_VER" >> "$GITHUB_OUTPUT"
          echo "api_version=$API_VER" >> "$GITHUB_OUTPUT"

      - name: Build addon zip (excludes anything in .build-ignore)
        run: |
          mkdir -p /tmp/build/AutoLuaMemoryCleaner
          rsync -a --exclude-from=.build-ignore ./ /tmp/build/AutoLuaMemoryCleaner/
          cd /tmp/build && zip -r AutoLuaMemoryCleaner.zip AutoLuaMemoryCleaner
          echo "zip_file=/tmp/build/AutoLuaMemoryCleaner.zip" >> "$GITHUB_ENV"

      - name: Extract latest changelog entries
        run: |
          awk '/^### Version / { if (found) exit; found=1 } found' CHANGELOG_GITHUB.txt > latest_changes_github.md
          awk '/^Version: / { if (found) exit; found=1 } found' CHANGELOG.md > latest_changes_plain.md
          echo "--- GitHub Release body (rendered markdown) ---"
          cat latest_changes_github.md
          echo "--- Plain changelog (for step summaries) ---"
          cat latest_changes_plain.md

      - name: Test upload to ESOUI (dry run)
        id: dry_test
        if: inputs.test_run == true
        uses: m00nyONE/esoui-upload@main
        with:
          api_key: ${{ secrets.ESOUI_API_KEY }}
          addon_id: '4388'
          version: ${{ steps.version.outputs.version }}
          zip_file: ${{ env.zip_file }}
          changelog_file: 'CHANGELOG_ESOUI.txt'
          description_file: 'README_ESOUI.txt'
          test: true

      - name: Annotate test result
        if: always() && inputs.test_run == true
        run: |
          STATUS="${{ steps.dry_test.outcome }}"
          if [ "$STATUS" == "success" ]; then
            TITLE="Test Release Complete"
            DETAIL=""
          else
            TITLE="Test Release Failed"
            DETAIL=" Check the 'Test upload to ESOUI' step's log above - an input problem (missing/invalid api_key, addon_id, zip, changelog or description file) shows its own annotation there. A rejection from ESOUI's server won't show a response body (the upload action's curl call discards it), so a failure with no other detail usually means the API key, addon ID, or version was rejected server-side."
          fi
          echo "::notice title=$TITLE::Version ${{ steps.version.outputs.display_version }} (AddOnVersion ${{ steps.version.outputs.version }}), declared API ${{ steps.version.outputs.api_version }}.$DETAIL"
          {
            echo "## $TITLE"
            echo ""
            echo "- **Version:** ${{ steps.version.outputs.display_version }} (AddOnVersion \`${{ steps.version.outputs.version }}\`)"
            echo "- **Declared API:** ${{ steps.version.outputs.api_version }}"
            if [ -n "$DETAIL" ]; then
              echo ""
              echo "${DETAIL# }"
            fi
            echo ""
            echo "### Changelog"
            echo '```'
            cat latest_changes_plain.md
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create GitHub Release (only if release_github was checked)
        id: gh_release
        if: inputs.release_github == true
        uses: ncipollo/release-action@v1
        with:
          name: Version-${{ steps.version.outputs.display_version }}
          tag: Version-${{ steps.version.outputs.display_version }}
          artifacts: ${{ env.zip_file }}
          artifactContentType: application/zip
          bodyFile: latest_changes_github.md
          allowUpdates: true
          makeLatest: true

      - name: Annotate GitHub Release result
        if: always() && inputs.release_github == true
        run: |
          STATUS="${{ steps.gh_release.outcome }}"
          if [ "$STATUS" == "success" ]; then
            TITLE="GitHub Release Complete"
            DETAIL=""
          else
            TITLE="GitHub Release Failed"
            DETAIL=" GitHub Release creation failed - check the 'Create GitHub Release' step's log above (common causes: tag already exists on a different commit, bad artifact path, missing contents:write permission)."
          fi
          echo "::notice title=$TITLE::Version ${{ steps.version.outputs.display_version }} (AddOnVersion ${{ steps.version.outputs.version }}), declared API ${{ steps.version.outputs.api_version }}.$DETAIL"
          {
            echo "## $TITLE"
            echo ""
            echo "- **Version:** ${{ steps.version.outputs.display_version }} (AddOnVersion \`${{ steps.version.outputs.version }}\`)"
            echo "- **Declared API:** ${{ steps.version.outputs.api_version }}"
            if [ -n "$DETAIL" ]; then
              echo ""
              echo "${DETAIL# }"
            fi
            echo ""
            echo "### Changelog"
            echo '```'
            cat latest_changes_plain.md
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload to ESOUI (real, only if upload_esoui was checked)
        id: real_upload
        if: inputs.upload_esoui == true
        uses: m00nyONE/esoui-upload@main
        with:
          api_key: ${{ secrets.ESOUI_API_KEY }}
          addon_id: '4388'
          version: ${{ steps.version.outputs.version }}
          zip_file: ${{ env.zip_file }}
          changelog_file: 'CHANGELOG_ESOUI.txt'
          description_file: 'README_ESOUI.txt'

      - name: Annotate ESOUI upload result
        if: always() && inputs.upload_esoui == true
        run: |
          STATUS="${{ steps.real_upload.outcome }}"
          if [ "$STATUS" == "success" ]; then
            TITLE="ESOUI Upload Complete"
            DETAIL=""
          else
            TITLE="ESOUI Upload Failed"
            DETAIL=" ESOUI upload failed - check the 'Upload to ESOUI (real)' step's log above. An input problem shows its own annotation there; a rejection from ESOUI's server won't show a response body (the upload action's curl call discards it), so a failure with no other detail usually means the API key, addon ID, or version was rejected server-side."
          fi
          echo "::notice title=$TITLE::Version ${{ steps.version.outputs.display_version }} (AddOnVersion ${{ steps.version.outputs.version }}), declared API ${{ steps.version.outputs.api_version }}.$DETAIL"
          {
            echo "## $TITLE"
            echo ""
            echo "- **Version:** ${{ steps.version.outputs.display_version }} (AddOnVersion \`${{ steps.version.outputs.version }}\`)"
            echo "- **Declared API:** ${{ steps.version.outputs.api_version }}"
            if [ -n "$DETAIL" ]; then
              echo ""
              echo "${DETAIL# }"
            fi
            echo ""
            echo "### Changelog"
            echo '```'
            cat latest_changes_plain.md
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
