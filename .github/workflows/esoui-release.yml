name: ESOUI Release

on:
  workflow_dispatch:
    inputs:
      real_upload:
        description: "Also do the REAL upload + create a GitHub Release? Leave unchecked to just test."
        type: boolean
        default: false

jobs:
  check:
    uses: ./.github/workflows/lua-check.yml

  release:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read version from manifest
        id: version
        run: |
          VER=$(grep "^## AddOnVersion:" AutoLuaMemoryCleaner.addon | awk '{print $3}')
          DISPLAY_VER=$(grep "^## Version:" AutoLuaMemoryCleaner.addon | awk '{print $3}')
          API_VER=$(grep "^## APIVersion:" AutoLuaMemoryCleaner.addon | awk '{print $3, $4}')
          echo "Read version: $VER (display: $DISPLAY_VER, API: $API_VER)"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "display_version=$DISPLAY_VER" >> "$GITHUB_OUTPUT"
          echo "api_version=$API_VER" >> "$GITHUB_OUTPUT"

      - name: Build addon zip (excludes anything in .build-ignore)
        run: |
          mkdir -p /tmp/build/AutoLuaMemoryCleaner
          rsync -a --exclude-from=.build-ignore ./ /tmp/build/AutoLuaMemoryCleaner/
          cd /tmp/build && zip -r AutoLuaMemoryCleaner.zip AutoLuaMemoryCleaner
          echo "zip_file=/tmp/build/AutoLuaMemoryCleaner.zip" >> "$GITHUB_ENV"

      - name: Extract latest changelog entry (for the GitHub Release body)
        run: |
          awk '/^### Version / { if (found) exit; found=1 } found' CHANGELOG_GITHUB.txt > latest_changes.md
          cat latest_changes.md

      - name: Test upload to ESOUI (dry run - always runs)
        id: dry_test
        uses: m00nyONE/esoui-upload@main
        with:
          api_key: ${{ secrets.ESOUI_API_KEY }}
          addon_id: '4388'
          version: ${{ steps.version.outputs.version }}
          zip_file: ${{ env.zip_file }}
          changelog_file: 'CHANGELOG_ESOUI.txt'
          description_file: 'README_ESOUI.txt'
          test: true

      - name: Annotate test result
        if: always()
        run: |
          STATUS="${{ steps.dry_test.outcome }}"
          if [ "$STATUS" == "success" ]; then
            TITLE="Test Release Complete"
          else
            TITLE="Test Release Failed"
          fi
          echo "::notice title=$TITLE::Version ${{ steps.version.outputs.display_version }} (AddOnVersion ${{ steps.version.outputs.version }}), declared API ${{ steps.version.outputs.api_version }}."
          {
            echo "## $TITLE"
            echo ""
            echo "- **Version:** ${{ steps.version.outputs.display_version }} (AddOnVersion \`${{ steps.version.outputs.version }}\`)"
            echo "- **Declared API:** ${{ steps.version.outputs.api_version }}"
            echo ""
            echo "### Changelog"
            echo '```'
            cat latest_changes.md
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create GitHub Release (only if real_upload was checked)
        if: inputs.real_upload == true
        uses: ncipollo/release-action@v1
        with:
          name: Version-${{ steps.version.outputs.display_version }}
          tag: Version-${{ steps.version.outputs.display_version }}
          artifacts: ${{ env.zip_file }}
          artifactContentType: application/zip
          bodyFile: latest_changes.md
          allowUpdates: true
          makeLatest: true

      - name: Upload to ESOUI (real - only if real_upload was checked)
        id: real_upload
        if: inputs.real_upload == true
        uses: m00nyONE/esoui-upload@main
        with:
          api_key: ${{ secrets.ESOUI_API_KEY }}
          addon_id: '4388'
          version: ${{ steps.version.outputs.version }}
          zip_file: ${{ env.zip_file }}
          changelog_file: 'CHANGELOG_ESOUI.txt'
          description_file: 'README_ESOUI.txt'

      - name: Annotate release result
        if: always() && inputs.real_upload == true
        run: |
          STATUS="${{ steps.real_upload.outcome }}"
          if [ "$STATUS" == "success" ]; then
            TITLE="Release Complete"
          else
            TITLE="Release Failed"
          fi
          echo "::notice title=$TITLE::Version ${{ steps.version.outputs.display_version }} (AddOnVersion ${{ steps.version.outputs.version }}), declared API ${{ steps.version.outputs.api_version }}."
          {
            echo "## $TITLE"
            echo ""
            echo "- **Version:** ${{ steps.version.outputs.display_version }} (AddOnVersion \`${{ steps.version.outputs.version }}\`)"
            echo "- **Declared API:** ${{ steps.version.outputs.api_version }}"
            echo ""
            echo "### Changelog"
            echo '```'
            cat latest_changes.md
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
