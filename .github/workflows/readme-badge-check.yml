name: README Badge Check

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'AutoLuaMemoryCleaner.addon'
  workflow_dispatch:
    inputs:
      fix:
        description: 'Auto-fix stale badge values instead of just failing'
        type: boolean
        default: false
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: MPHONlC/eso-readme-badge-check@Version-0.0.1
        with:
          manifest_file: 'AutoLuaMemoryCleaner.addon'
          fix: ${{ inputs.fix }}

      - name: Commit fix, if anything changed
        if: inputs.fix == true
        run: |
          git config user.name "MPHONlC"
          git config user.email "207844175+MPHONlC@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: refresh README badges to match manifest [skip ci]"
            git push --force-with-lease origin HEAD:main
          fi
