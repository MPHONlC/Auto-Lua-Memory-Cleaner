name: Fix Contributor

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type REWRITE to confirm - this rewrites ALL commit history and force-pushes. Irreversible for anyone who has cloned this repo."
        required: true
        type: string
      bot_login:
        description: "The bot identity's commit author email to rewrite"
        required: false
        type: string
        default: "41898282+github-actions[bot]@users.noreply.github.com"
      new_name:
        description: "Real git name to rewrite those commits to"
        required: false
        type: string
        default: "MPHONlC"
      new_email:
        description: "Real git email to rewrite those commits to"
        required: false
        type: string
        default: "207844175+MPHONlC@users.noreply.github.com"

jobs:
  rewrite:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check confirmation
        run: |
          if [ "${{ inputs.confirm }}" != "REWRITE" ]; then
            echo "::error title=Aborted::Type REWRITE to confirm - nothing was changed."
            exit 1
          fi

      - name: Checkout (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install git-filter-repo
        run: pip install --quiet git-filter-repo

      - name: Rewrite matching commits to the real identity
        run: |
          git filter-repo --force --commit-callback "
          if commit.author_email == b'${{ inputs.bot_login }}':
              commit.author_name = b'${{ inputs.new_name }}'
              commit.author_email = b'${{ inputs.new_email }}'
          if commit.committer_email == b'${{ inputs.bot_login }}':
              commit.committer_name = b'${{ inputs.new_name }}'
              commit.committer_email = b'${{ inputs.new_email }}'
          "

      - name: Push rewritten history
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${REPO}.git"
          git push --force-with-lease origin --all
          git push --force-with-lease origin --tags

      - name: Annotate success
        if: success()
        run: echo "::notice title=History Rewrite Complete::Rewrote bot commits to ${{ inputs.new_name }} and force-pushed. Contributors graph updates in a few minutes."

      - name: Annotate failure
        if: failure()
        run: echo "::error title=History Rewrite Failed::Check the step logs above. If main has branch protection blocking force-pushes, disable it under Settings, Branches, re-run, then re-enable it."
