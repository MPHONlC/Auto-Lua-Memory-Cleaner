name: Version Refresh

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 12 * * *'   # once a day, 12:00 UTC
  workflow_dispatch:
  workflow_call:

jobs:
  refresh-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: MPHONlC/version-refresh@Version-0.0.2
        with:
          manifest_file: 'AutoLuaMemoryCleaner.addon'
          field_name: 'AddOnVersion'
          format: 'YYMMDDVVV'
          git_name: 'MPHONlC'
          git_email: '207844175+MPHONlC@users.noreply.github.com'
