name: Slash Command Doc Check

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: MPHONlC/eso-slash-command-doc-check@Version-0.0.3
        with:
          doc_files: |
            README_BBCODE.txt
            README.md
            README_COMMONMARK.txt
