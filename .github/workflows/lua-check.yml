name: Lua Check

on:
  workflow_dispatch:

jobs:
  lua-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1

      - name: Syntax check every .lua file
        run: find . -name "*.lua" -print0 | xargs -0 -n1 luac5.1 -p

      - name: Static lint (luacheck)
        uses: lunarmodules/luacheck@v1
